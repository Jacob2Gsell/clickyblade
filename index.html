<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clicky Blade</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    * { cursor: none; } /* the game is keyboard only, so the mouse pointer is never shown */
    canvas { display: block; }
    #slowmo-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      opacity: 0; transition: opacity 0.25s;
    }
    #slowmo-overlay.active { opacity: 1; }
    .focus-label {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      font: 600 20px system-ui, sans-serif; letter-spacing: 0.35em; text-indent: 0.35em;
      color: #e8f4ff; text-shadow: 0 0 12px rgba(102, 204, 255, 0.6);
    }
    #lexicon {
      position: fixed; left: 24px; top: 80px; bottom: 24px; width: 220px; z-index: 5;
      display: flex; flex-direction: column; gap: 8px; overflow: hidden;
      opacity: 0; transition: opacity 0.25s;
      font-family: system-ui, sans-serif; color: #fff;
    }
    #lexicon.active { opacity: 1; }
    .lex-title {
      font: 600 14px system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase;
      color: #e8f4ff; text-shadow: 0 0 12px rgba(102, 204, 255, 0.6);
    }
    .spell {
      padding: 8px 10px; flex: none;
      background: #1f232a; border: 2px solid #3a404b; border-radius: 6px;
    }
    .spell-name { font-weight: 600; font-size: 15px; color: #6cf; margin-bottom: 4px; }
    .spell-effect { font-size: 13px; color: #ccc; line-height: 1.35; }
    .spell.spell-active { border-color: #6cf; box-shadow: 0 0 12px rgba(102, 204, 255, 0.4); }
    .spell-match { color: #6f6; }
    #spell-input {
      position: fixed; left: 260px; top: 80px; width: 240px; z-index: 5;
      padding: 8px 10px; box-sizing: border-box;
      font: 16px system-ui, sans-serif; color: #fff;
      background: #1f232a; border: 2px solid #3a404b; border-radius: 6px; outline: none;
      opacity: 0; transition: opacity 0.25s;
    }
    #spell-input.active { opacity: 1; }
    #spell-input.active:focus { border-color: #6cf; }
    #pause-menu {
      display: none; position: fixed; inset: 0; z-index: 10;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      font-family: system-ui, sans-serif; color: #fff;
    }
    #pause-menu.open { display: flex; }
    .pause-title { font-size: 48px; font-weight: bold; margin-bottom: 16px; }
    .menu-item {
      width: 220px; padding: 10px 0; box-sizing: border-box; text-align: center;
      font: 18px system-ui, sans-serif; color: #fff;
      background: #1f232a; border: 2px solid #3a404b; border-radius: 4px;
    }
    #main-menu {
      display: none; position: fixed; inset: 0; z-index: 20;
      flex-direction: column; align-items: center;
      padding-top: 8vh; box-sizing: border-box;
      background: #111; font-family: system-ui, sans-serif; color: #fff;
    }
    #main-menu.open { display: flex; }
    .menu-title {
      font-size: 72px; font-weight: 800; letter-spacing: 0.15em; text-indent: 0.15em;
      text-transform: uppercase; color: #e8f4ff;
      text-shadow: 0 0 24px rgba(102, 204, 255, 0.5);
    }
    .menu-center {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6vh; padding-bottom: 12vh;
    }
    .char-row { display: flex; gap: 24px; }
    .char-card {
      width: 180px; height: 240px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: #1f232a; border: 2px solid #3a404b; border-radius: 6px;
      font: 18px system-ui, sans-serif; color: #fff;
    }
    .char-card img { width: 110px; height: 110px; }
    .render-status { font: 16px system-ui, sans-serif; color: #ccc; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="slowmo-overlay"><span class="focus-label">FOKUS</span></div>
  <div id="lexicon"></div>
  <input id="spell-input" type="text" placeholder="Zauberspruch" autocomplete="off" spellcheck="false" maxlength="40">
  <div id="pause-menu">
    <div class="pause-title">PAUSED</div>
    <div class="menu-item">Proceed [P]</div>
    <div class="menu-item">Main menu [M]</div>
    <div class="menu-item" id="render-pause">Render: Graphics [R]</div>
  </div>
  <div id="main-menu" class="open">
    <div class="menu-title">Clicky Blade</div>
    <div class="menu-center">
      <div class="char-row">
        <div class="char-card"><img src="icons/knight.svg" alt="">Knight [1]</div>
        <div class="char-card"><img src="icons/assassin.svg" alt="">Assassin [2]</div>
        <div class="char-card"><img src="icons/archer.svg" alt="">Archer [3]</div>
      </div>
      <div class="menu-item" id="render-main">Render: Graphics [R]</div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
